# Deliberate breaks of the segments of `crates/jennings-core/src/segments.rs` and of their
# checks in `jennings/coverage/segments.py` and `certificate.py`, each caught by its tests:
# `python tools/break_check.py tools/breaks/segments.toml` from the repository root, with the
# extension built (the breaks of Python are tested against it as built).

command = "cargo test -p jennings-core --lib segments"

[[break]]
name = "a location is fed though the run wrote it first"
file = "crates/jennings-core/src/segments.rs"
old = "        if !self.on || self.touched_in[l] >> 1 == self.run {"
new = "        if !self.on || self.touched_in[l] == self.run << 1 {"

[[break]]
name = "registers an instruction reads are not fed"
file = "crates/jennings-core/src/segments.rs"
old = "            t.read(REG + r, now[r as usize]);"
new = "            let _ = (r, now);"

