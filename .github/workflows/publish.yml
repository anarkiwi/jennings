name: Publish

# Publishes to PyPI via trusted publishing (OIDC). Register the trusted publisher
# on PyPI: project jennings, owner anarkiwi, repo anarkiwi/jennings, workflow
# publish.yml, environment pypi.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64, smoke: true}
          - {os: ubuntu-24.04-arm, target: aarch64, smoke: true}
          - {os: macos-14, target: aarch64, smoke: false}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # abi3-py311: one cp311-abi3 wheel per platform serves 3.11+.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked --out dist
      - name: Smoke test
        if: matrix.smoke
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import jennings._core, jennings.memory as m; assert m.NATIVE"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
