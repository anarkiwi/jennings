name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format
        run: black --check jennings/ tests/
      - name: Lint
        run: pylint jennings/
      - name: Test
        run: pytest tests/ -n auto --cov=jennings --cov-fail-under=85
