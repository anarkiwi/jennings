name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format
        run: black --check jennings/ tests/
      - name: Lint
        run: pylint jennings/
      - name: Test
        run: pytest tests/ -n auto --cov=jennings --cov-fail-under=85

  sidplayer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build fixture
        run: >-
          docker build --target artifacts
          --output type=local,dest=tests/fixtures/sidplayer tests/fixtures/sidplayer
      - name: Check committed fixture is current
        run: git diff --exit-code tests/fixtures/sidplayer
