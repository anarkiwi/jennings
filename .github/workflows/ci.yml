name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format
        run: black --check jennings/ tests/
      - name: Lint
        run: pylint jennings/
      - name: Test
        run: pytest tests/ -n auto --cov=jennings --cov-fail-under=85

  sidplayer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build fixture
        run: >-
          docker build --target artifacts
          --output type=local,dest=tests/fixtures/sidplayer tests/fixtures/sidplayer
      - name: Check committed fixture is current
        run: git diff --exit-code tests/fixtures/sidplayer

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # cargo test links the abi3 cdylib's test harness against libpython.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/native.Dockerfile
          build-args: PYTHON_VERSION=${{ matrix.python }}
          tags: jennings-native:${{ matrix.python }}
          load: true
          cache-from: type=gha,scope=native-${{ matrix.python }}
          cache-to: type=gha,scope=native-${{ matrix.python }},mode=max
      - name: Test
        run: docker run --rm jennings-native:${{ matrix.python }}

  sdist:
    runs-on: ubuntu-latest
    container: python:3.12-slim-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
      - name: Install without a Rust toolchain
        run: |
          if command -v cargo; then exit 1; fi
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.tar.gz pytest py65 numpy
      # Tests run from a copy without the in-tree package so imports resolve to the install.
      - name: Test pure-Python install
        run: |
          mkdir /tmp/sd && cp -r tests /tmp/sd/
          cd /tmp/sd
          /tmp/venv/bin/python -c "
          import jennings.memory as m
          from jennings.devices.mpu6502 import MPU
          assert not m.NATIVE
          c = MPU()
          c.memory[0:2] = [0xA9, 0x42]
          c.step()
          assert (c.a, c.pc) == (0x42, 2)
          "
          /tmp/venv/bin/pytest -q tests/test_mpu6502.py tests/test_memory.py
